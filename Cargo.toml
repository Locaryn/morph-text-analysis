[package]
name = "locaryn-plugin-text-analysis"
version = "2.0.0"
edition = "2021"
description = "Official Locaryn Extension: Text Analysis, Sentiment, NER & Batch Processing"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-text-analysis-mcp"
path = "src/bin/text_analysis_mcp.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[workspace]
